[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ideafile"
version = "0.1.0"
description = "Spec format + linter for Karpathy-style idea files: share the idea, let agents build"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "mehmet turac", email = "mehmetturac@gmail.com" }]
keywords = ["agents", "idea-file", "cli", "markdown"]

[project.scripts]
ideafile = "ideafile.cli:main"

[tool.setuptools]
packages = ["ideafile"]
